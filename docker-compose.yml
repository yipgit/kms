services:
  obsidian-helper:
    build:
      context: .
      dockerfile: Dockerfile.helper
    container_name: obsidian-helper
    env_file: [.env]
    environment:
      VAULT_PATH: /app/vault
    volumes:
      - type: bind
        source: ${HOST_VAULT_PATH:?Set HOST_VAULT_PATH in .env}
        target: /app/vault
    ports:
      - "127.0.0.1:${OBSIDIAN_HELPER_PORT:-8080}:8080"
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  telegram-collector:
    build: .
    container_name: telegram-collector
    env_file:
      - .env
    environment:
      # The container must always use its mount point, not a Windows host path.
      VAULT_PATH: /tmp/collector-vault
      OBSIDIAN_HELPER_URL: http://obsidian-helper:8080
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "test $$(find /tmp/bot_heartbeat -mmin -2 | wc -l) -gt 0 || exit 1" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      obsidian-helper:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # Reserved worker boundary for RSS/PDF/browser inputs. Keep it stopped until
  # a queue-backed processor is enabled; it intentionally has no data access.
  ai-processor:
    image: busybox:1.36
    container_name: ai-processor
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    restart: always
    profiles: [future]
