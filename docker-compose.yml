services:
  kms-bot:
    build: .
    container_name: kms-bot
    env_file:
      - .env
    volumes:
      - ./vault:/app/vault
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "test $$(find /tmp/bot_heartbeat -mmin -2 | wc -l) -gt 0 || exit 1" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "autoheal=true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Use network host if you need to access local proxies easily, 
    # but for most cases standard network is fine.
    # network_mode: "host" 
